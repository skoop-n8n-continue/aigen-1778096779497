<!DOCTYPE html>
<html lang="en">
<head>
  <!-- skoop-live-prescript -->
  <!-- skoop-live-runtime -->
  <script src="./skoop-live.js"></script>
  <script>
  // Skoop live-preview fetch shim — only active when dirty data is injected
  (function () {
    if (typeof window === 'undefined' || !window.__skoop_dirty_data__) return;
    var dirty = window.__skoop_dirty_data__;
    var origFetch = window.fetch ? window.fetch.bind(window) : null;
    window.fetch = function (input, init) {
      try {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        // Match bare 'data.json', './data.json', or any URL ending /data.json (with or without query)
        if (/(^|\/)data\.json(\?.*)?$/.test(url) || url === 'data.json') {
          var body = JSON.stringify(dirty);
          return Promise.resolve(new Response(body, {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          }));
        }
      } catch (e) {}
      return origFetch ? origFetch(input, init) : Promise.reject(new Error('fetch unavailable'));
    };
  })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lahore Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container">
        <h1 id="city-name">Lahore, Pakistan</h1>
        <div class="current-weather">
            <img id="weather-icon" src="" alt="Weather Icon">
            <div class="temperature">
                <span id="current-temp">--</span>°C
            </div>
            <div class="description" id="weather-desc">--</div>
        </div>
        <div class="forecast">
            <h2>Weather Forecast</h2>
            <div id="forecast-list">
                <!-- Forecast items will be populated here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
